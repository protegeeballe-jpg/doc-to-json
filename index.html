<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Document to JSON Converter</title>
    <!-- Include PDF.js library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Include SheetJS (xlsx/csv) library from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Include Tailwind CSS for modern UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 750px; margin: 40px auto; padding: 20px; text-align: center; background: #f4f4f9; }
        textarea { width: 100%; height: 250px; margin-top: 15px; padding: 10px; font-family: monospace; border-radius: 5px; border: 1px solid #ccc; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <h2 class="text-2xl font-bold mb-2">Universal Document to JSON Converter</h2>
    <p class="text-gray-600 mb-4">Convert PDFs, Text, JSON, CSV, and Excel files into clean, structured JSON.</p>

    <!-- General Options Toolbar -->
    <div class="flex justify-center items-center gap-2 mb-3 text-sm text-gray-700 bg-white p-3 rounded-lg shadow-sm border border-gray-200">
        <label class="flex items-center cursor-pointer select-none">
            <input type="checkbox" id="preserveStrings" class="mr-2 h-4 w-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500" checked>
            <span class="font-medium">Preserve values as strings (prevents stripping leading zeros)</span>
        </label>
    </div>

    <!-- Phase 4: Bible Processing Mode Options Card -->
    <div class="mb-4 text-left text-sm text-gray-700 bg-blue-50 border border-blue-200 p-4 rounded-lg shadow-sm">
        <div class="flex items-center justify-between mb-2">
            <label class="flex items-center cursor-pointer select-none font-semibold text-blue-900">
                <input type="checkbox" id="enableBibleMode" class="mr-2 h-4 w-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                <span>Enable Specialized Bible Conversion (Phase 4)</span>
            </label>
            <span class="text-xs bg-blue-200 text-blue-800 px-2 py-0.5 rounded font-medium">My Heart Treasury</span>
        </div>

        <!-- Bible Metadata Controls (Revealed when Bible Mode is checked) -->
        <div id="bibleOptions" class="hidden grid grid-cols-1 md:grid-cols-2 gap-3 mt-3 pt-3 border-t border-blue-200">
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1" for="bibleTranslation">Translation / Edition Title</label>
                <input type="text" id="bibleTranslation" placeholder="e.g., Reina-Valera 2009" class="w-full text-xs p-2 rounded border border-gray-300 focus:ring-1 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1" for="bibleLanguage">Language Code</label>
                <select id="bibleLanguage" class="w-full text-xs p-2 rounded border border-gray-300 focus:ring-1 focus:ring-blue-500">
                    <option value="es">Spanish (es)</option>
                    <option value="en">English (en)</option>
                    <option value="pt">Portuguese (pt)</option>
                    <option value="custom">Other / Custom</option>
                </select>
            </div>
            <div class="md:col-span-2 flex items-center gap-4 mt-1">
                <label class="flex items-center cursor-pointer text-xs select-none">
                    <input type="checkbox" id="stripFootnotes" class="mr-1.5 h-3.5 w-3.5 text-blue-600 rounded" checked>
                    <span>Strip Footnote Anchors & Side Notes</span>
                </label>
                <label class="flex items-center cursor-pointer text-xs select-none">
                    <input type="checkbox" id="runValidation" class="mr-1.5 h-3.5 w-3.5 text-blue-600 rounded" checked>
                    <span>Perform Canon Validation Checks</span>
                </label>
            </div>
        </div>
    </div>

    <!-- Enhanced Drag & Drop Zone -->
    <div id="dropZone" class="border-2 border-dashed border-blue-400 p-8 bg-white text-center rounded-lg cursor-pointer hover:border-blue-600 hover:bg-blue-50 transition shadow-sm mb-4">
        <input type="file" id="fileInput" accept=".pdf,.txt,.json,.csv,.xlsx,.xls" class="hidden">
        <p class="text-gray-600 font-medium">Drag and drop your file here (.pdf, .txt, .json, .csv, .xlsx), or <span class="text-blue-600 font-semibold underline">browse</span></p>
    </div>

    <!-- File Information Display -->
    <div id="fileInfo" class="text-sm text-gray-700 font-medium mb-3"></div>

    <!-- Live Progress Bar Container -->
    <div id="progressContainer" class="mb-4 hidden">
        <div class="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden shadow-inner">
            <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <span id="progressText" class="text-xs text-gray-500 mt-1 block">Processing...</span>
    </div>

    <div id="status" class="font-bold text-gray-600 my-2"></div>
    
    <!-- Action Buttons -->
    <div class="flex justify-center gap-3">
        <button id="downloadBtn" class="bg-blue-600 text-white font-semibold border-none px-5 py-2.5 text-base rounded-md cursor-pointer hover:bg-blue-700 transition shadow-sm" style="display:none;">Download Structured JSON</button>
        <button id="downloadReportBtn" class="bg-amber-600 text-white font-semibold border-none px-5 py-2.5 text-base rounded-md cursor-pointer hover:bg-amber-700 transition shadow-sm" style="display:none;">Download Validation Report</button>
    </div>

    <!-- Output Display -->
    <textarea id="output" placeholder="Structured JSON output will appear here..."></textarea>

    <!-- Links to script.js -->
    <script src="script.js"></script>
</body>
</html>
